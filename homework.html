<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassSaver - Homework</title>

    <link rel="stylesheet" href="homework.css">

</head>


<body>

    <main>

        <!-- Homework heading and Add button -->

        <header>

            <h1>Homework</h1>

            <button id="addHomeworkBtn">+</button>

        </header>


        <!-- Add Homework Form -->

        <section id="addHomeworkForm">

            <h2>Add Homework</h2>

            <form id="homeworkForm">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter homework title"
                    required
                >


                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter subject"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter description"
                    required
                ></textarea>


                <label for="dueDate">
                    Due Date
                </label>

                <input
                    type="date"
                    id="dueDate"
                    required
                >


                <div class="form-buttons">

                    <button type="submit">
                        Save
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Homework cards will appear here -->

        <section id="homeworkContainer">

            <p id="emptyMessage">
                No homeworks
            </p>

        </section>

    </main>


    <script src="homework.js"></script>

</body>

</html>
